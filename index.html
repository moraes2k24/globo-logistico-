<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Globo Logístico</title>
<style>
  html, body { margin: 0; height: 100%; background: #000814; font-family: Arial, sans-serif; color: #fff; overflow: hidden; }
  #globo { position: absolute; inset: 0; }
  #painel { position: absolute; top: 20px; left: 20px; width: 340px; max-width: calc(100% - 40px); background: rgba(0,20,50,0.82); border: 1px solid #1e90ff; border-radius: 12px; padding: 18px; z-index: 10; }
  #painel h1 { font-size: 15px; margin: 0 0 4px 0; color: #7fc4ff; text-transform: uppercase; }
  #ano { font-size: 54px; font-weight: bold; margin: 0; line-height: 1; }
  #titulo { font-size: 18px; font-weight: bold; margin: 8px 0 6px 0; color: #ffd166; }
  #texto { font-size: 14px; line-height: 1.45; margin: 0 0 12px 0; }
  .metricas { display: flex; gap: 8px; }
  .metrica { flex: 1; background: rgba(30,144,255,0.18); border-radius: 8px; padding: 8px; text-align: center; }
  .metrica b { display: block; font-size: 20px; color: #4dffb8; }
  .metrica span { font-size: 11px; color: #cde; }
  .mais { display: block; margin-top: 12px; padding: 10px; text-align: center; border: 1px solid #4dffb8; border-radius: 8px; color: #4dffb8; text-decoration: none; font-size: 14px; }
  .mais:hover { background: rgba(77,255,184,0.12); }
  #controles { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 640px; max-width: calc(100% - 40px); background: rgba(0,20,50,0.82); border: 1px solid #1e90ff; border-radius: 12px; padding: 12px 16px; z-index: 10; display: flex; align-items: center; gap: 14px; box-sizing: border-box; }
  button { background: #1e90ff; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  input[type=range] { flex: 1; }
  #rotulo { font-size: 13px; min-width: 50px; text-align: right; }

  /* Seletor de idioma */
  #idiomas { position: absolute; top: 20px; right: 20px; z-index: 10; display: flex; gap: 6px; background: rgba(0,20,50,0.82); border: 1px solid #1e90ff; border-radius: 12px; padding: 6px; }
  #idiomas button { background: transparent; padding: 8px 12px; font-size: 13px; color: #cde; }
  #idiomas button.ativo { background: #1e90ff; color: #fff; }
  #idiomas button:focus-visible { outline: 2px solid #4dffb8; outline-offset: 1px; }

  /* Rótulos no globo */
  .rot { position: absolute; pointer-events: none; white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 8px #000, 0 1px 2px #000; }
  .rot.continente { font-size: 20px; font-weight: bold; letter-spacing: 2px; color: rgba(255,255,255,0.9); transform: translate(-50%, -50%); }
  .rot.estado { font-size: 11px; color: #bfe3ff; transform: translate(-50%, -50%); }
  .rot.cidade, .rot.hub { font-size: 12px; color: #fff; transform: translate(9px, -50%); }
  .rot.hub { font-size: 13px; font-weight: bold; color: #ffd166; }
  .rot.cidade::before { content: ''; position: absolute; left: -9px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: #fff; box-shadow: 0 0 4px #000; }
</style>
</head>
<body>
<div id="globo"></div>

<div id="idiomas" role="group" aria-label="Idioma / Language / Idioma">
  <button data-lang="pt">Português</button>
  <button data-lang="en">English</button>
  <button data-lang="es">Español</button>
</div>

<div id="painel">
  <h1>NovaTech Eletrônicos</h1>
  <p id="ano">2026</p>
  <p id="titulo"></p>
  <p id="texto"></p>
  <div class="metricas">
    <div class="metrica"><b id="m-custo"></b><span id="l-custo"></span></div>
    <div class="metrica"><b id="m-co2"></b><span id="l-co2"></span></div>
    <div class="metrica"><b id="m-prazo"></b><span id="l-prazo"></span></div>
  </div>
  <a id="detalhes" class="mais" href="detalhe.html?ano=2026"></a>
</div>

<div id="controles">
  <button id="btn">Pausar</button>
  <input type="range" id="linha" min="0" max="9" value="0" step="1">
  <span id="rotulo">2026</span>
</div>

<script src="https://unpkg.com/globe.gl"></script>

  { n: 'São Paulo', lat: -22.3, lng: -48.7 }, { n: 'Sergipe', lat: -10.6, lng: -37.4 }, { n: 'Tocantins', lat: -10.2, lng: -48.3 },

// Lista única de rótulos
const TODOS = [

  ...ESTADOS.map(d => ({ ...d, tipo: 'estado' }))

/* ============ DADOS DOS ANOS (português) ============ */

/* ============ GLOBO ============ */
const globo = Globe()(document.getElementById('globo'))
  .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
  .pointLat(d => d.lat).pointLng(d => d.lng)
  .pointColor(() => '#ffd166').pointAltitude(0.02).pointRadius(0.45)
  .pointLabel(d => nm(d.n))
  .arcStartLat(d => C[d.o].lat).arcStartLng(d => C[d.o].lng)
  .arcEndLat(d => C[d.d].lat).arcEndLng(d => C[d.d].lng)
  .arcColor(() => ['#4dffb8', '#1e90ff'])
  .arcStroke(d => d.esp * 0.8)
  .arcDashLength(0.4).arcDashGap(0.2).arcDashAnimateTime(1800)
  .arcAltitudeAutoScale(0.4)
  // Rótulos de texto (HTML, aceitam acentos)
  .htmlLat(d => d.lat).htmlLng(d => d.lng).htmlAltitude(0.01)
  .htmlElement(d => {
    const el = document.createElement('div');
    el.className = 'rot ' + d.tipo;
    el.textContent = nm(d.n);
    return el;
  });

globo.pointsData(Object.values(C));
globo.controls().autoRotate = true;
globo.controls().autoRotateSpeed = 0.5;
globo.pointOfView({ lat: 10, lng: -20, altitude: 2.4 });

// Quais rótulos aparecem em cada nível de zoom
let ultimaQtd = -1;
function rotulosVisiveis() {
  const alt = globo.pointOfView().altitude;
  return TODOS.filter(d =>
    d.tipo === 'continente' ? alt > 1.6 :
    d.tipo === 'hub'        ? true :
    d.tipo === 'cidade'     ? alt < 1.6 :
                              alt < 0.9);   // estado
}
function atualizarRotulos(forcar) {
  const lista = rotulosVisiveis();
  if (!forcar && lista.length === ultimaQtd) return;
  ultimaQtd = lista.length;
  globo.htmlElementsData([]);       // limpa para recriar já no idioma certo
  globo.htmlElementsData(lista);
}
globo.controls().addEventListener('change', () => atualizarRotulos(false));
atualizarRotulos(true);

/* ============ PAINEL ============ */
let indice = 0;
let tocando = true;
let relogio = null;

function mostrar(i) {
  indice = i;
  const a = ANOS[i];
  const u = UI[IDIOMAS[L]];
  const [titulo, texto] = L === 0 ? [a.titulo, a.texto] : TR[IDIOMAS[L]][i];
  document.getElementById('ano').textContent = a.ano;
  document.getElementById('titulo').textContent = titulo;
  document.getElementById('texto').textContent = texto;
  document.getElementById('m-custo').textContent = a.custo;
  document.getElementById('m-co2').textContent = a.co2;
  document.getElementById('m-prazo').textContent = parseInt(a.prazo) + ' ' + u.dias;
  document.getElementById('linha').value = i;
  document.getElementById('rotulo').textContent = a.ano;
  document.getElementById('detalhes').href = 'detalhe.html?ano=' + a.ano + '&lang=' + IDIOMAS[L];
  globo.arcsData(a.rotas.map(r => ({ o: r[0], d: r[1], esp: r[2] })));
}

function aplicarIdioma() {
  const cod = IDIOMAS[L];
  const u = UI[cod];
  document.documentElement.lang = HTML_LANG[cod];
  document.title = u.titulo;
  document.getElementById('l-custo').textContent = u.custo;
  document.getElementById('l-co2').textContent = u.co2;
  document.getElementById('l-prazo').textContent = u.prazo;
  document.getElementById('detalhes').textContent = u.mais;
  document.getElementById('btn').textContent = tocando ? u.pausar : u.continuar;
  document.querySelectorAll('#idiomas button').forEach(b => b.classList.toggle('ativo', b.dataset.lang === cod));
  window.GLOBO_IDIOMA = cod;
  mostrar(indice);
  atualizarRotulos(true);
}

function iniciar() {
  clearInterval(relogio);
  relogio = setInterval(() => {
    mostrar((indice + 1) % ANOS.length);
  }, 7000);
}

document.getElementById('btn').onclick = () => {
  tocando = !tocando;
  document.getElementById('btn').textContent = tocando ? UI[IDIOMAS[L]].pausar : UI[IDIOMAS[L]].continuar;
  if (tocando) { iniciar(); } else { clearInterval(relogio); }
};

document.getElementById('linha').oninput = (e) => {
  mostrar(parseInt(e.target.value));
  if (tocando) { iniciar(); }
};

document.querySelectorAll('#idiomas button').forEach(b => {
  b.onclick = () => {
    L = IDIOMAS.indexOf(b.dataset.lang);
    try { localStorage.setItem('idioma', b.dataset.lang); } catch (e) {}
    aplicarIdioma();
  };
});

// Se voltar da página de detalhe, começa no ano que a pessoa estava vendo
const anoUrl = parseInt(new URLSearchParams(location.search).get('ano'));
const inicio = ANOS.findIndex(a => a.ano === anoUrl);
indice = inicio >= 0 ? inicio : 0;
aplicarIdioma();
iniciar();
</script>
<script src="ia.js"></script>
</body>
</html>
